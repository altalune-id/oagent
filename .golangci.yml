version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: standard
  enable:
    - errorlint
    - gochecknoglobals
    - gocritic
    - nilerr

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - ifElseChain
        - hugeParam
        - rangeValCopy

  exclusions:
    generated: strict
    rules:
      - path: version/version\.go
        linters:
          - gochecknoglobals
      - path: _test\.go
        linters:
          - errcheck
          - gochecknoglobals
          - gocritic
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - altalune.id/auth-server

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
