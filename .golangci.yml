version: "2"

run:
  timeout: 3m
  tests: true
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gochecknoglobals
    - gocritic
    - gosec
    - lll
    - misspell
    - modernize
    - nilerr
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    lll:
      line-length: 140
      tab-width: 1
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - ifElseChain
        - hugeParam
        - rangeValCopy
    gosec:
      excludes:
        - G104    # duplicates errcheck
        - G404    # weak random OK for non-crypto uses
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: unexported-return
          disabled: true
    forbidigo:
      forbid:
        - pattern: 'fmt\.Print(f|ln|)\('
          msg: "use cmd.OutOrStdout() or slog for output"
        - pattern: 'slog\.(Info|Warn|Error|Debug)Context\('
          msg: "use an injected *slog.Logger, not the slog default"
      exclude-godoc-examples: true
      analyze-types: true
    depguard:
      rules:
        migrator-purity:
          list-mode: strict
          files:
            - "**/migrator/*.go"
            - "!**/migrator/*_test.go"
          allow:
            - $gostd
            - github.com/jackc/pgx/v5
            - github.com/pressly/goose/v3
            - altalune.id/oagent/pg
        httpclient-purity:
          list-mode: strict
          files:
            - "**/httpclient/*.go"
            - "!**/httpclient/*_test.go"
          allow:
            - $gostd
            - go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp
        mcp-purity:
          list-mode: strict
          files:
            - "**/mcp/*.go"
            - "!**/internal/mcp/*.go"
            - "!**/mcp/*_test.go"
          allow:
            - $gostd
            - github.com/modelcontextprotocol/go-sdk
            - github.com/google/jsonschema-go
            - altalune.id/oagent/apperror
        root-boundary:
          list-mode: lax
          files:
            - "**/apperror/**"
            - "**/config/**"
            - "**/httpclient/**"
            - "**/mcp/**"
            - "**/nanoid/**"
            - "**/password/**"
            - "**/pg/**"
            - "**/reqid/**"
            - "**/scope/**"
            - "**/slug/**"
            - "**/telemetry/**"
            - "**/version/**"
            - "**/worker/**"
            - "!**/internal/mcp/**"
          deny:
            - pkg: "altalune.id/oagent/internal"
              desc: "root-level shared packages must NOT depend on any internal/ package (import inversion)"

  exclusions:
    generated: strict
    warn-unused: false
    rules:
      - path: version/version\.go
        linters:
          - gochecknoglobals
      - path: httpclient/safe\.go
        linters:
          - gochecknoglobals
      - path: gen/
        linters:
          - all
      - path: cmd/gen-config-example/
        linters:
          - lll
      - path: _test\.go
        linters:
          - lll
          - errcheck
          - gochecknoglobals
          - gocritic
          - gosec
          - prealloc
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - altalune.id/oagent

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
