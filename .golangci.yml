version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: standard

  exclusions:
    generated: strict

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - altalune.id/auth-server

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
