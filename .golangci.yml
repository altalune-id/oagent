version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: standard
  enable:
    - depguard      # keeps migrator app-agnostic
    - errorlint
    - gochecknoglobals
    - gocritic
    - gosec
    - nilerr
    - revive
    - unconvert
    - unparam

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - ifElseChain
        - hugeParam
        - rangeValCopy
    gosec:
      excludes:
        - G104    # duplicates errcheck
        - G404    # weak random OK for non-crypto uses
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: unexported-return
          disabled: true
    depguard:
      rules:
        migrator-purity:
          list-mode: strict
          files:
            - "**/migrator/*.go"
            - "!**/migrator/*_test.go"
          allow:
            - $gostd
            - github.com/jackc/pgx/v5
            - github.com/pressly/goose/v3
            - altalune.id/auth-server/pg

  exclusions:
    generated: strict
    rules:
      - path: version/version\.go
        linters:
          - gochecknoglobals
      - path: _test\.go
        linters:
          - errcheck
          - gochecknoglobals
          - gocritic
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - altalune.id/auth-server

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
