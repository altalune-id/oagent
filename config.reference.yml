# oagent — auto-generated from config struct tags.
# DO NOT edit by hand. Run `go run ./cmd/gen-config-example --format=yaml` to regenerate.
#
# Copy to config.yml, uncomment what you need to set, and the app picks it up.
# Every field maps to an env var (shown as `env: OAGENT_*` in the per-field comment).
# Env vars override YAML.
#
# Awareness markers (in [brackets] on the per-field comment):
#   required   — must be non-empty for the app to boot
#   bootstrap  — set once at first-run; changing later has no effect or breaks things
#   secret     — never commit; use env vars or a secret store

api:
  openapi:
    # [secret] env: OAGENT_API_OPENAPI_BASIC_AUTH_PASSWORD
    basicAuthPassword: ""
    # env: OAGENT_API_OPENAPI_BASIC_AUTH_USER
    basicAuthUser: ""
    # env: OAGENT_API_OPENAPI_ENABLED
    enabled: true
    # env: OAGENT_API_OPENAPI_REQUIRE_BASIC_AUTH
    requireBasicAuth: true

auth:
  basic:
    # [secret] env: OAGENT_AUTH_BASIC_PASSWORD
    password: ""
    # env: OAGENT_AUTH_BASIC_USER
    user: ""
  genesis:
    # env: OAGENT_AUTH_GENESIS_EMAIL
    email: ""
    # [secret] env: OAGENT_AUTH_GENESIS_PASSWORD
    password: ""
  # env: OAGENT_AUTH_MODE
  mode: local
  # password:
  #   # env: OAGENT_AUTH_PASSWORD_ENABLED
  #   enabled:
  # env: OAGENT_AUTH_REMEMBER_LAST_USER
  rememberLastUser: true
  # env: OAGENT_AUTH_SESSION_TTL
  sessionTTL: 24h

channel:
  # env: OAGENT_CHANNEL_ALLOW_PRIVATE_HOSTS
  allowPrivateHosts: ""
  # env: OAGENT_CHANNEL_DEFAULT_OPENWA_BASE_URL
  defaultOpenwaBaseURL: ""
  # env: OAGENT_CHANNEL_MAX_MESSAGE_AGE
  maxMessageAge: 30m
  # env: OAGENT_CHANNEL_REPLY_IDLE_POLL
  replyIdlePoll: 15s

cli:
  # env: OAGENT_CLI_SESSION_FILE
  sessionFile: ~/.oagent/session.json

compliance:
  # env: OAGENT_COMPLIANCE_PRIVACY_URL
  privacyURL: ""
  # env: OAGENT_COMPLIANCE_REQUIRE_ACCEPTANCE
  requireAcceptance: ""
  # env: OAGENT_COMPLIANCE_TERMS_URL
  termsURL: ""
  # env: OAGENT_COMPLIANCE_TERMS_UPDATED_AT
  termsUpdatedAt: ""

db:
  # env: OAGENT_DB_AUTO_MIGRATE
  autoMigrate: true
  # env: OAGENT_DB_DRIVER
  driver: postgres
  rls:
    # [bootstrap] env: OAGENT_DB_RLS_ALLOW_BYPASS
    allowBypass: false

# [required, bootstrap] env: OAGENT_ENV
env: production

http:
  # [required] env: OAGENT_HTTP_ADDR
  addr: ":5150"
  # env: OAGENT_HTTP_BASE_PATH
  basePath: ""
  # env: OAGENT_HTTP_BASE_URL
  baseURL: ""
  # env: OAGENT_HTTP_COOKIE_SECURE
  cookieSecure: true
  # env: OAGENT_HTTP_SHUTDOWN_GRACE
  shutdownGrace: 30s
  # [secret] env: OAGENT_HTTP_STATE_SECRET
  stateSecret: ""
  # env: OAGENT_HTTP_TRUSTED_PROXY_HOPS
  trustedProxyHops: 0

install:
  # [secret] env: OAGENT_INSTALL_TOKEN
  token: ""

mail:
  # env: OAGENT_MAIL_DRIVER
  driver: console
  # env: OAGENT_MAIL_FROM
  from: ""
  # env: OAGENT_MAIL_IDLE_POLL
  idlePoll: 5s
  resend:
    # [secret] env: OAGENT_MAIL_RESEND_API_KEY
    apiKey: ""
  smtp:
    # env: OAGENT_MAIL_SMTP_HOST
    host: ""
    # [secret] env: OAGENT_MAIL_SMTP_PASSWORD
    password: ""
    # env: OAGENT_MAIL_SMTP_PORT
    port: 587
    # env: OAGENT_MAIL_SMTP_TIMEOUT
    timeout: 10s
    # env: OAGENT_MAIL_SMTP_TLS
    tls: starttls
    # env: OAGENT_MAIL_SMTP_USERNAME
    username: ""

mcp:
  # env: OAGENT_MCP_APPS_UI
  appsUI: ""
  # env: OAGENT_MCP_AUDIENCE
  audience: ""
  # env: OAGENT_MCP_AUDIENCE_OVERRIDE
  audienceOverride: ""
  # env: OAGENT_MCP_CLOCK_SKEW
  clockSkew: 60s
  # env: OAGENT_MCP_ENABLED
  enabled: false

# [required, bootstrap] env: OAGENT_MODE
mode: selfhosted

nats:
  # env: OAGENT_NATS_CONNECT_TIMEOUT
  connectTimeout: 10s
  # env: OAGENT_NATS_NAME
  name: oagent
  # [secret] env: OAGENT_NATS_PASSWORD
  password: ""
  # [secret] env: OAGENT_NATS_TOKEN
  token: ""
  # [secret] env: OAGENT_NATS_URL
  url: ""
  # env: OAGENT_NATS_USER
  user: ""

oidc:
  # env: OAGENT_OIDC_ACCOUNT_URL
  accountURL: ""
  # env: OAGENT_OIDC_BUTTON_LABEL
  buttonLabel: Continue with SSO
  # env: OAGENT_OIDC_CLIENT_ID
  clientID: ""
  # [secret] env: OAGENT_OIDC_CLIENT_SECRET
  clientSecret: ""
  # env: OAGENT_OIDC_ISSUER
  issuer: ""
  # env: OAGENT_OIDC_SCOPES
  scopes: openid,profile,email

outbox:
  # env: OAGENT_OUTBOX_IDLE_POLL
  idlePoll: 5s

postgres:
  # env: OAGENT_POSTGRES_CONN_MAX_IDLE_TIME
  connMaxIdleTime: ""
  # env: OAGENT_POSTGRES_CONN_MAX_LIFETIME
  connMaxLifetime: ""
  # env: OAGENT_POSTGRES_CONNECT_BACKOFF
  connectBackoff: 250ms
  # env: OAGENT_POSTGRES_CONNECT_TIMEOUT
  connectTimeout: 5s
  # [required, secret] env: OAGENT_POSTGRES_DSN
  dsn: ""
  health:
    # env: OAGENT_POSTGRES_HEALTH_INTERVAL
    interval: 30s
    # env: OAGENT_POSTGRES_HEALTH_TIMEOUT
    timeout: 2s
  # env: OAGENT_POSTGRES_MAX_IDLE_CONNS
  maxIdleConns: ""
  # env: OAGENT_POSTGRES_MAX_OPEN_CONNS
  maxOpenConns: ""
  migrator:
    # [secret] env: OAGENT_POSTGRES_MIGRATOR_DSN
    dsn: ""
    # env: OAGENT_POSTGRES_MIGRATOR_ROLE
    role: ""
  reader:
    # env: OAGENT_POSTGRES_READER_CONN_MAX_IDLE_TIME
    connMaxIdleTime: ""
    # env: OAGENT_POSTGRES_READER_CONN_MAX_LIFETIME
    connMaxLifetime: ""
    # [secret] env: OAGENT_POSTGRES_READER_DSN
    dsn: ""
    # env: OAGENT_POSTGRES_READER_MAX_IDLE_CONNS
    maxIdleConns: ""
    # env: OAGENT_POSTGRES_READER_MAX_OPEN_CONNS
    maxOpenConns: ""
    # env: OAGENT_POSTGRES_READER_ROLE
    role: ""
  # env: OAGENT_POSTGRES_ROLE
  role: ""
  # [bootstrap] env: OAGENT_POSTGRES_SCHEMA
  schema: public
  # [bootstrap] env: OAGENT_POSTGRES_TABLE_PREFIX
  tablePrefix: ""

queue:
  # env: OAGENT_QUEUE_DRIVER
  driver: nats
  # env: OAGENT_QUEUE_ENABLED
  enabled: false

rateLimit:
  auth:
    # env: OAGENT_RATE_LIMIT_AUTH_ENABLED
    enabled: true
  dataPlane:
    # env: OAGENT_RATE_LIMIT_DATA_PLANE_ENABLED
    enabled: true
    # env: OAGENT_RATE_LIMIT_DATA_PLANE_PER_IP_PER_MINUTE
    perIPPerMinute: 600
    # env: OAGENT_RATE_LIMIT_DATA_PLANE_PER_KEY_PER_MINUTE
    perKeyPerMinute: 600
  # env: OAGENT_RATE_LIMIT_DRIVER
  driver: memory
  ingest:
    # env: OAGENT_RATE_LIMIT_INGEST_BURST
    burst: 30
    # env: OAGENT_RATE_LIMIT_INGEST_ENABLED
    enabled: true
    # env: OAGENT_RATE_LIMIT_INGEST_PER_CONNECTION_PER_MINUTE
    perConnectionPerMinute: 120
    # env: OAGENT_RATE_LIMIT_INGEST_PER_IP_PER_MINUTE
    perIPPerMinute: 600
  # env: OAGENT_RATE_LIMIT_MAX_KEYS
  maxKeys: 100000

redis:
  # env: OAGENT_REDIS_CONNECT_TIMEOUT
  connectTimeout: 5s
  # env: OAGENT_REDIS_KEY_PREFIX
  keyPrefix: "oagent:"
  # env: OAGENT_REDIS_MAX_CONNECTIONS
  maxConnections: 10
  # env: OAGENT_REDIS_MAX_IDLE_TIME
  maxIdleTime: 5m
  # env: OAGENT_REDIS_MIN_IDLE_CONNECTIONS
  minIdleConnections: 0
  # env: OAGENT_REDIS_READ_TIMEOUT
  readTimeout: 3s
  # [secret] env: OAGENT_REDIS_URL
  url: ""
  # env: OAGENT_REDIS_WRITE_TIMEOUT
  writeTimeout: 3s

run:
  # env: OAGENT_RUN_DRAIN_TIMEOUT
  drainTimeout: 25s
  # env: OAGENT_RUN_HEARTBEAT
  heartbeat: 20s
  # env: OAGENT_RUN_LEASE_TTL
  leaseTTL: 60s
  # env: OAGENT_RUN_MAX_ATTEMPTS
  maxAttempts: 3
  # env: OAGENT_RUN_MAX_CONCURRENT_PER_INSTANCE
  maxConcurrentPerInstance: 8
  # env: OAGENT_RUN_MAX_CONCURRENT_PER_PROJECT
  maxConcurrentPerProject: 4
  # env: OAGENT_RUN_MAX_PER_MINUTE_PER_PROJECT
  maxPerMinutePerProject: 30
  # env: OAGENT_RUN_SWEEP_EVERY
  sweepEvery: 15s
  # env: OAGENT_RUN_TURN_TIMEOUT
  turnTimeout: 10m

runtime:
  # env: OAGENT_RUNTIME_DRIVER
  driver: http
  # [secret] env: OAGENT_RUNTIME_TOKEN
  token: ""
  # env: OAGENT_RUNTIME_URL
  url: ""

scheduler:
  # env: OAGENT_SCHEDULER_ENABLED
  enabled: true
  # env: OAGENT_SCHEDULER_SHUTDOWN_GRACE
  shutdownGrace: 30s

secrets:
  # env: OAGENT_SECRETS_ENCRYPTION_KEY
  encryptionKey: ""

snapshot:
  # env: OAGENT_SNAPSHOT_DRIVER
  driver: postgres

telemetry:
  metrics:
    # env: OAGENT_TELEMETRY_METRICS_ENABLED
    enabled: ""
    # env: OAGENT_TELEMETRY_METRICS_EXPORT_INTERVAL
    exportInterval: 30s
    prometheus:
      # env: OAGENT_TELEMETRY_METRICS_PROMETHEUS_ADDR
      addr: ":9090"
      # env: OAGENT_TELEMETRY_METRICS_PROMETHEUS_ENABLED
      enabled: ""
      # env: OAGENT_TELEMETRY_METRICS_PROMETHEUS_PATH
      path: /metrics
  otlp:
    # env: OAGENT_TELEMETRY_OTLP_ENDPOINT
    endpoint: ""
    # env: OAGENT_TELEMETRY_OTLP_HEADERS
    headers: ""
    # env: OAGENT_TELEMETRY_OTLP_INSECURE
    insecure: ""
    # env: OAGENT_TELEMETRY_OTLP_PROTOCOL
    protocol: ""
  tracing:
    # env: OAGENT_TELEMETRY_TRACING_ENABLED
    enabled: ""
    # env: OAGENT_TELEMETRY_TRACING_SAMPLE_RATIO
    sampleRatio: ""
