# Local dev copy of the shared Altalune NATS layout (github.com/altalune-id/nats): one account per app.
# OTHER stands in for another app on the same server, so a job published by oagent never reaches it.
server_name: oagent-dev-nats
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  max_file_store: 2G
  max_memory_store: 64M
}

accounts {
  OAGENT {
    jetstream { max_file: 1G, max_mem: 16M }
    users: [{ user: oagent, password: $OAGENT_NATS_PASSWORD }]
  }
  OTHER {
    jetstream { max_file: 256M, max_mem: 8M }
    users: [{ user: other, password: $OTHER_NATS_PASSWORD }]
  }
}
