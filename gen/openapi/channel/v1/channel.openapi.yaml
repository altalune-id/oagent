components:
  schemas:
    channel.v1.Connection:
      type: object
      properties:
        id:
          type: string
          title: id
        orgId:
          type: string
          title: org_id
        projectId:
          type: string
          title: project_id
        agentId:
          type: string
          title: agent_id
        provider:
          type: string
          title: provider
        enabled:
          type: boolean
          title: enabled
        status:
          title: status
          $ref: '#/components/schemas/channel.v1.ConnectionStatus'
        baseUrl:
          type: string
          title: base_url
        openwaOrg:
          type: string
          title: openwa_org
        openwaProject:
          type: string
          title: openwa_project
        deviceId:
          type: string
          title: device_id
        webhookUrl:
          type: string
          title: webhook_url
          description: webhook_url is where OpenWA posts this connection's deliveries.
        secondarySet:
          type: boolean
          title: secondary_set
          description: secondary_set is true while the previous signing secret is still accepted after a rotation.
        quietWindowMs:
          type: integer
          title: quiet_window_ms
          format: int32
        quietMaxMs:
          type: integer
          title: quiet_max_ms
          format: int32
        replyFailure:
          type: string
          title: reply_failure
        replyVoice:
          type: string
          title: reply_voice
        replyPhotoUnreadable:
          type: string
          title: reply_photo_unreadable
        lastResultAt:
          title: last_result_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastBadSignatureAt:
          title: last_bad_signature_at
          description: last_bad_signature_at is when a delivery last failed the signature check; it never changes the status.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        secretSet:
          type: boolean
          title: secret_set
          description: secret_set is false until the signing secret OpenWA mints is set; deliveries are refused until then.
        approvalPrompt:
          type: string
          title: approval_prompt
          description: approval_prompt is the WhatsApp approval prompt; {preview} is replaced by what the agent asks to do.
        approvalExpired:
          type: string
          title: approval_expired
          description: approval_expired is sent when an approval expires before the requester answers.
      title: Connection
      additionalProperties: false
      description: Connection binds an agent to an OpenWA device; enabled is the admin switch, separate from the reported status.
    channel.v1.ConnectionStatus:
      type: string
      title: ConnectionStatus
      enum:
        - CONNECTION_STATUS_UNSPECIFIED
        - CONNECTION_STATUS_WAITING
        - CONNECTION_STATUS_CONNECTED
        - CONNECTION_STATUS_DEVICE_MISMATCH
        - CONNECTION_STATUS_KEY_REFUSED
      description: ConnectionStatus is what the last verified delivery or provider call showed; WAITING until the first. A bad signature is never a status.
    channel.v1.CreateConnectionRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
        agentId:
          type: string
          title: agent_id
          description: |
            oagent.public_id = true
        baseUrl:
          type: string
          title: base_url
          description: |
            channel.base_url.format
            channel.base_url.max_len.2048
        openwaOrg:
          type: string
          title: openwa_org
          maxLength: 128
        openwaProject:
          type: string
          title: openwa_project
          maxLength: 128
        deviceId:
          type: string
          title: device_id
          pattern: ^dev_[A-Za-z0-9_-]{16}$
        deviceKey:
          type: string
          title: device_key
          maxLength: 512
          description: 'device_key is write-only: the OpenWA key bound to the device, sealed at rest and never returned.'
        quietWindowMs:
          type:
            - integer
            - "null"
          title: quiet_window_ms
          maximum: 10000
          minimum: 0
          format: int32
        quietMaxMs:
          type:
            - integer
            - "null"
          title: quiet_max_ms
          maximum: 10000
          minimum: 0
          format: int32
        replyFailure:
          type: string
          title: reply_failure
          maxLength: 1000
        replyVoice:
          type: string
          title: reply_voice
          maxLength: 1000
        replyPhotoUnreadable:
          type: string
          title: reply_photo_unreadable
          maxLength: 1000
      title: CreateConnectionRequest
      required:
        - projectId
        - agentId
        - baseUrl
        - openwaOrg
        - openwaProject
        - deviceId
        - deviceKey
      additionalProperties: false
    channel.v1.CreateConnectionResponse:
      type: object
      properties:
        connection:
          title: connection
          $ref: '#/components/schemas/channel.v1.Connection'
      title: CreateConnectionResponse
      additionalProperties: false
    channel.v1.DeleteConnectionRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
      title: DeleteConnectionRequest
      required:
        - id
      additionalProperties: false
    channel.v1.DeleteConnectionResponse:
      type: object
      title: DeleteConnectionResponse
      additionalProperties: false
    channel.v1.GetChannelSettingsRequest:
      type: object
      title: GetChannelSettingsRequest
      additionalProperties: false
    channel.v1.GetChannelSettingsResponse:
      type: object
      properties:
        defaultOpenwaBaseUrl:
          type: string
          title: default_openwa_base_url
        replyFailure:
          type: string
          title: reply_failure
        replyVoice:
          type: string
          title: reply_voice
        replyPhotoUnreadable:
          type: string
          title: reply_photo_unreadable
        quietWindowMs:
          type: integer
          title: quiet_window_ms
          format: int32
        quietMaxMs:
          type: integer
          title: quiet_max_ms
          format: int32
        maxMessageAgeMinutes:
          type: integer
          title: max_message_age_minutes
          format: int32
        approvalPrompt:
          type: string
          title: approval_prompt
        approvalExpired:
          type: string
          title: approval_expired
      title: GetChannelSettingsResponse
      additionalProperties: false
      description: 'GetChannelSettingsResponse is what a new connection starts with: the operator''s default OpenWA URL (empty when unset), the set replies and quiet times, and the message age limit.'
    channel.v1.GetConnectionRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
      title: GetConnectionRequest
      required:
        - id
      additionalProperties: false
    channel.v1.GetConnectionResponse:
      type: object
      properties:
        connection:
          title: connection
          $ref: '#/components/schemas/channel.v1.Connection'
      title: GetConnectionResponse
      additionalProperties: false
    channel.v1.ListConnectionsRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
        agentId:
          type: string
          title: agent_id
          description: |
            oagent.public_id = true
      title: ListConnectionsRequest
      required:
        - projectId
      additionalProperties: false
      description: ListConnectionsRequest lists a project's connections; agent_id, when set, limits it to one agent's.
    channel.v1.ListConnectionsResponse:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/channel.v1.Connection'
          title: connections
      title: ListConnectionsResponse
      additionalProperties: false
    channel.v1.SetConnectionSecretRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
        signingSecret:
          type: string
          title: signing_secret
          maxLength: 512
        dropPrevious:
          type: boolean
          title: drop_previous
      title: SetConnectionSecretRequest
      required:
        - id
        - signingSecret
      additionalProperties: false
      description: SetConnectionSecretRequest makes signing_secret the primary secret; the old one stays valid as secondary unless drop_previous, which is a no-op on the first set.
    channel.v1.SetConnectionSecretResponse:
      type: object
      properties:
        connection:
          title: connection
          $ref: '#/components/schemas/channel.v1.Connection'
      title: SetConnectionSecretResponse
      additionalProperties: false
    channel.v1.UpdateConnectionRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
        baseUrl:
          type:
            - string
            - "null"
          title: base_url
          description: |
            channel.base_url.format
            channel.base_url.max_len.2048
        openwaOrg:
          type:
            - string
            - "null"
          title: openwa_org
          maxLength: 128
          minLength: 1
        openwaProject:
          type:
            - string
            - "null"
          title: openwa_project
          maxLength: 128
          minLength: 1
        deviceId:
          type:
            - string
            - "null"
          title: device_id
          pattern: ^dev_[A-Za-z0-9_-]{16}$
        deviceKey:
          type:
            - string
            - "null"
          title: device_key
          maxLength: 512
          minLength: 1
          description: device_key is write-only; leaving it unset keeps the stored key.
        quietWindowMs:
          type:
            - integer
            - "null"
          title: quiet_window_ms
          maximum: 10000
          minimum: 0
          format: int32
        quietMaxMs:
          type:
            - integer
            - "null"
          title: quiet_max_ms
          maximum: 10000
          minimum: 0
          format: int32
        replyFailure:
          type: string
          title: reply_failure
          maxLength: 1000
        replyVoice:
          type: string
          title: reply_voice
          maxLength: 1000
        replyPhotoUnreadable:
          type: string
          title: reply_photo_unreadable
          maxLength: 1000
        enabled:
          type:
            - boolean
            - "null"
          title: enabled
        approvalPrompt:
          type:
            - string
            - "null"
          title: approval_prompt
          maxLength: 1000
          minLength: 1
          description: |
            approval_prompt and approval_expired left unset keep the stored text; the prompt must show the preview.
            string.contains = "{preview}"
        approvalExpired:
          type:
            - string
            - "null"
          title: approval_expired
          maxLength: 1000
          minLength: 1
      title: UpdateConnectionRequest
      required:
        - id
      additionalProperties: false
      description: 'UpdateConnectionRequest changes a connection''s settings: an unset field keeps the stored value, and an empty set reply keeps it. A new base_url or device_id needs a new device_key.'
    channel.v1.UpdateConnectionResponse:
      type: object
      properties:
        connection:
          title: connection
          $ref: '#/components/schemas/channel.v1.Connection'
      title: UpdateConnectionResponse
      additionalProperties: false
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A ProtoJSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a ProtoJSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
security: []
tags:
  - name: channel.v1.ChannelService
    description: ChannelService manages the messaging channel connections that bind an agent to a WhatsApp device through OpenWA. Every id is a public id; the signing secret and the device key are write-only, and the RPCs that take one have no MCP tool. A connection is created first, its webhook_url is pasted into OpenWA, and the secret OpenWA then mints is set with SetConnectionSecret.
