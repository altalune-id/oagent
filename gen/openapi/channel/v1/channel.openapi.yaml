openapi: 3.1.0
info:
  title: channel.v1
paths:
  /channel.v1.ChannelService/CreateConnection:
    post:
      tags:
        - channel.v1.ChannelService
      summary: CreateConnection
      operationId: channel.v1.ChannelService.CreateConnection
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/channel.v1.CreateConnectionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/channel.v1.CreateConnectionResponse'
  /channel.v1.ChannelService/DeleteConnection:
    post:
      tags:
        - channel.v1.ChannelService
      summary: DeleteConnection
      operationId: channel.v1.ChannelService.DeleteConnection
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/channel.v1.DeleteConnectionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/channel.v1.DeleteConnectionResponse'
  /channel.v1.ChannelService/GetChannelSettings:
    post:
      tags:
        - channel.v1.ChannelService
      summary: GetChannelSettings
      operationId: channel.v1.ChannelService.GetChannelSettings
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/channel.v1.GetChannelSettingsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/channel.v1.GetChannelSettingsResponse'
  /channel.v1.ChannelService/GetConnection:
    post:
      tags:
        - channel.v1.ChannelService
      summary: GetConnection
      operationId: channel.v1.ChannelService.GetConnection
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/channel.v1.GetConnectionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/channel.v1.GetConnectionResponse'
  /channel.v1.ChannelService/ListConnections:
    post:
      tags:
        - channel.v1.ChannelService
      summary: ListConnections
      operationId: channel.v1.ChannelService.ListConnections
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/channel.v1.ListConnectionsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/channel.v1.ListConnectionsResponse'
  /channel.v1.ChannelService/SetConnectionSecret:
    post:
      tags:
        - channel.v1.ChannelService
      summary: SetConnectionSecret
      operationId: channel.v1.ChannelService.SetConnectionSecret
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/channel.v1.SetConnectionSecretRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/channel.v1.SetConnectionSecretResponse'
  /channel.v1.ChannelService/UpdateConnection:
    post:
      tags:
        - channel.v1.ChannelService
      summary: UpdateConnection
      operationId: channel.v1.ChannelService.UpdateConnection
      parameters:
        - name: Connect-Protocol-Version
          in: header
