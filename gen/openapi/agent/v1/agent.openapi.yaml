openapi: 3.1.0
info:
  title: agent.v1
paths:
  /agent.v1.AgentService/CreateAgent:
    post:
      tags:
        - agent.v1.AgentService
      summary: CreateAgent
      operationId: agent.v1.AgentService.CreateAgent
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.CreateAgentRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent.v1.CreateAgentResponse'
  /agent.v1.AgentService/DeleteAgent:
    post:
      tags:
        - agent.v1.AgentService
      summary: DeleteAgent
      operationId: agent.v1.AgentService.DeleteAgent
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.DeleteAgentRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent.v1.DeleteAgentResponse'
  /agent.v1.AgentService/GetAgent:
    post:
      tags:
        - agent.v1.AgentService
      summary: GetAgent
      operationId: agent.v1.AgentService.GetAgent
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.GetAgentRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent.v1.GetAgentResponse'
  /agent.v1.AgentService/ListAgentVersions:
    post:
      tags:
        - agent.v1.AgentService
      summary: ListAgentVersions
      operationId: agent.v1.AgentService.ListAgentVersions
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.ListAgentVersionsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent.v1.ListAgentVersionsResponse'
  /agent.v1.AgentService/ListAgents:
    post:
      tags:
        - agent.v1.AgentService
      summary: ListAgents
      operationId: agent.v1.AgentService.ListAgents
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.ListAgentsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent.v1.ListAgentsResponse'
  /agent.v1.AgentService/PublishAgent:
    post:
      tags:
        - agent.v1.AgentService
      summary: PublishAgent
      operationId: agent.v1.AgentService.PublishAgent
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.PublishAgentRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent.v1.PublishAgentResponse'
  /agent.v1.AgentService/UpdateAgent:
    post:
      tags:
        - agent.v1.AgentService
      summary: UpdateAgent
      operationId: agent.v1.AgentService.UpdateAgent
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.UpdateAgentRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent.v1.UpdateAgentResponse'
  /agent.v1.AgentService/UpdateAgentDraft:
    post:
      tags:
        - agent.v1.AgentService
      summary: UpdateAgentDraft
      operationId: agent.v1.AgentService.UpdateAgentDraft
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.UpdateAgentDraftRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent.v1.UpdateAgentDraftResponse'
components:
  schemas:
    agent.v1.Agent:
      type: object
      properties:
        id:
          type: string
          title: id
        orgId:
          type: string
          title: org_id
        projectId:
          type: string
          title: project_id
        slug:
          type: string
          title: slug
        name:
          type: string
          title: name
        description:
          type: string
          title: description
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        draft:
          title: draft
          $ref: '#/components/schemas/agent.v1.AgentConfig'
        publishedVersion:
          type: integer
          title: published_version
          format: int32
          description: published_version is the latest version's number, 0 when the agent was never published.
        draftUpdatedAt:
          title: draft_updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        unpublishedChanges:
          type: boolean
          title: unpublished_changes
          description: unpublished_changes is true when the draft was edited after the last publish.
        effectiveConfig:
          title: effective_config
          description: effective_config is the draft with unset values resolved to the current recommended values.
          $ref: '#/components/schemas/agent.v1.AgentEffective'
      title: Agent
      additionalProperties: false
    agent.v1.AgentConfig:
      type: object
      properties:
        instructions:
          type: string
          title: instructions
          description: |
            agent.instructions.max_len.32000
        model:
          type: string
          title: model
          pattern: ^[A-Za-z0-9._:/-]*$
          description: |
            agent.model.max_len.128
        temperature:
          type: number
          title: temperature
          maximum: 2
          minimum: 0
          format: double
        maxSteps:
          type: integer
          title: max_steps
          maximum: 100
          minimum: 0
          format: int32
        maxCostCents:
          type: integer
          title: max_cost_cents
          maximum: 1000000
          minimum: 0
          format: int32
        tools:
          type: array
          items:
            $ref: '#/components/schemas/agent.v1.AgentTool'
          title: tools
          maxItems: 64
          description: |
            agent.tools.unique
        providerId:
          type: string
          title: provider_id
          description: |
            oagent.public_id = true
        helperModel:
          type: string
          title: helper_model
          pattern: ^[A-Za-z0-9._:/-]*$
          description: |
            agent.helper_model.max_len.128
        mcpServers:
          type: array
          items:
            $ref: '#/components/schemas/agent.v1.McpGrant'
          title: mcp_servers
          maxItems: 16
          description: |
            agent.mcp_servers.unique
        providerMissing:
          type: boolean
          title: provider_missing
        knowledgeSourceIds:
          type: array
          items:
            type: string
            description: |
              oagent.public_id = true
          title: knowledge_source_ids
          maxItems: 16
          uniqueItems: true
        knowledgeSourcesMissing:
          type: integer
          title: knowledge_sources_missing
          format: int32
        knowledgeTuning:
          title: knowledge_tuning
          $ref: '#/components/schemas/agent.v1.KnowledgeTuning'
        memoryStoreId:
          type: string
          title: memory_store_id
          description: |
            oagent.public_id = true
        memoryStoreMissing:
          type: boolean
          title: memory_store_missing
        transcriptionModel:
          title: transcription_model
          $ref: '#/components/schemas/agent.v1.TranscriptionModel'
      title: AgentConfig
      additionalProperties: false
      description: 'AgentConfig is what an agent runs with; zero values mean the recommended value (max_steps, from GetAgent''s defaults) or no limit (max_cost_cents), and tool names are unique. tools is the legacy list a new draft never sets; provider_id is the model provider''s public id; provider_missing is output only; knowledge_source_ids are the knowledge sources searched before each turn, leaving out a deleted one, and knowledge_sources_missing is output only: how many bound sources no longer exist. knowledge_tuning shapes that search; unset fields use the recommended values. memory_store_id is the public id of the memory store the agent remembers people in, empty for none; memory_store_missing is output only: the bound store no longer exists.'
    agent.v1.AgentDefaults:
      type: object
      properties:
        maxSteps:
          type: integer
          title: max_steps
          format: int32
        maxMaxSteps:
          type: integer
          title: max_max_steps
          format: int32
        maxTemperature:
          type: number
          title: max_temperature
          format: double
        maxCostCents:
          type: integer
          title: max_cost_cents
          format: int32
        voiceNoteMaxSeconds:
          type: integer
          title: voice_note_max_seconds
          format: int32
        voiceNoteMaxBytes:
          type: integer
          title: voice_note_max_bytes
          format: int32
      title: AgentDefaults
      additionalProperties: false
      description: AgentDefaults are the recommended agent config values, their ranges and the voice note limits; the knowledge tuning defaults come from ListKnowledgeSources.
    agent.v1.AgentEffective:
      type: object
      properties:
        maxSteps:
          type: integer
          title: max_steps
          format: int32
        knowledgeTopK:
          type: integer
          title: knowledge_top_k
          format: int32
        knowledgeMinScore:
          type: number
          title: knowledge_min_score
          format: double
        knowledgeMaxTokens:
          type: integer
          title: knowledge_max_tokens
          format: int32
      title: AgentEffective
      additionalProperties: false
      description: 'AgentEffective is what a run uses for a config: unset values resolved to the recommended values current at read time, so it is never stored or frozen per version.'
    agent.v1.AgentTool:
      type: object
      properties:
        name:
          type: string
          title: name
          pattern: ^[a-zA-Z0-9_.-]{1,64}$
        requireApproval:
          type: boolean
          title: require_approval
        freeWhen:
          type: array
          items:
            $ref: '#/components/schemas/agent.v1.FreeCondition'
          title: free_when
          maxItems: 8
      title: AgentTool
      additionalProperties: false
      description: AgentTool is a tool the agent may call; require_approval makes a person approve each call, and free_when lets a call run without asking when every condition holds.
    agent.v1.AgentVersion:
      type: object
      properties:
        id:
          type: string
          title: id
        agentId:
          type: string
          title: agent_id
        version:
          type: integer
          title: version
          format: int32
        config:
          title: config
          $ref: '#/components/schemas/agent.v1.AgentConfig'
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        createdBy:
          type: string
          title: created_by
          description: created_by is the publishing person's user public id, empty for an API key.
        effectiveConfig:
          title: effective_config
          description: effective_config is config with unset values resolved to the current recommended values.
          $ref: '#/components/schemas/agent.v1.AgentEffective'
      title: AgentVersion
      additionalProperties: false
      description: AgentVersion is an immutable published configuration; version is a display label, id the public id.
    agent.v1.CreateAgentRequest:
      type: object
      properties:
        orgId:
          type: string
          title: org_id
          description: |
            oagent.public_id = true
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
        slug:
          type: string
          title: slug
          description: |
            oagent.slug.format = true
            oagent.slug.max_len.64 = true
            oagent.slug.min_len.3 = true
        name:
          type: string
          title: name
          description: |
            oagent.name.blank = true
            oagent.name.max_len.200 = true
        description:
          type: string
          title: description
          description: |
            agent.description.max_len.2000
      title: CreateAgentRequest
      required:
        - orgId
        - projectId
        - name
      additionalProperties: false
    agent.v1.CreateAgentResponse:
      type: object
      properties:
        agent:
          title: agent
          $ref: '#/components/schemas/agent.v1.Agent'
      title: CreateAgentResponse
      additionalProperties: false
    agent.v1.DeleteAgentRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
      title: DeleteAgentRequest
      required:
        - id
      additionalProperties: false
    agent.v1.DeleteAgentResponse:
      type: object
      title: DeleteAgentResponse
      additionalProperties: false
    agent.v1.FreeCondition:
      type: object
      properties:
        arg:
          type: string
          title: arg
          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
        values:
          type: array
          items:
            type: string
            minLength: 1
            description: |
              string.max_bytes = 256
          title: values
          maxItems: 16
        absent:
          type: boolean
          title: absent
      title: FreeCondition
      additionalProperties: false
      description: FreeCondition holds when the call's argument arg equals one of values, each a JSON value such as false or "draft", or when the argument is absent and absent is true.
    agent.v1.GetAgentRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
      title: GetAgentRequest
      required:
        - id
      additionalProperties: false
    agent.v1.GetAgentResponse:
      type: object
      properties:
        agent:
          title: agent
          $ref: '#/components/schemas/agent.v1.Agent'
        defaults:
          title: defaults
          $ref: '#/components/schemas/agent.v1.AgentDefaults'
      title: GetAgentResponse
      additionalProperties: false
    agent.v1.KnowledgeTuning:
      type: object
      properties:
        topK:
          type: integer
          title: top_k
          format: int32
          description: |
            agent.knowledge_tuning.top_k.range
        minScore:
          type:
            - number
            - "null"
          title: min_score
          maximum: 1
          minimum: 0
          format: double
        maxTokens:
          type: integer
          title: max_tokens
          format: int32
          description: |
            agent.knowledge_tuning.max_tokens.range
      title: KnowledgeTuning
      additionalProperties: false
      description: KnowledgeTuning shapes the knowledge search before each turn. top_k is the passages per answer and max_tokens the knowledge budget, 0 meaning the recommended value; min_score is the minimum relevance, unset meaning the recommended value (0 is a valid setting). ListKnowledgeSources returns the recommended values.
    agent.v1.ListAgentVersionsRequest:
      type: object
      properties:
        agentId:
          type: string
          title: agent_id
          description: |
            oagent.public_id = true
        limit:
          type: integer
          title: limit
          maximum: 100
          minimum: 0
          format: int32
      title: ListAgentVersionsRequest
      required:
        - agentId
      additionalProperties: false
      description: ListAgentVersionsRequest lists an agent's versions newest first; limit 0 means the server default of 50, and the most is 100.
    agent.v1.ListAgentVersionsResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/agent.v1.AgentVersion'
          title: versions
      title: ListAgentVersionsResponse
      additionalProperties: false
    agent.v1.ListAgentsRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
      title: ListAgentsRequest
      required:
        - projectId
      additionalProperties: false
    agent.v1.ListAgentsResponse:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/agent.v1.Agent'
          title: agents
        defaults:
          title: defaults
          $ref: '#/components/schemas/agent.v1.AgentDefaults'
      title: ListAgentsResponse
      additionalProperties: false
    agent.v1.McpGrant:
      type: object
      properties:
        serverId:
          type: string
          title: server_id
          description: |
            oagent.public_id = true
        tools:
          type: array
          items:
            $ref: '#/components/schemas/agent.v1.AgentTool'
          title: tools
          maxItems: 64
          description: |
            agent.grant_tools.unique
        missing:
          type: boolean
          title: missing
      title: McpGrant
      required:
        - serverId
      additionalProperties: false
      description: McpGrant lets an agent call the listed tools of one MCP server; missing is output only and true when the server no longer exists.
    agent.v1.PublishAgentRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
      title: PublishAgentRequest
      required:
        - id
      additionalProperties: false
    agent.v1.PublishAgentResponse:
      type: object
      properties:
        agent:
          title: agent
          $ref: '#/components/schemas/agent.v1.Agent'
        version:
          title: version
          $ref: '#/components/schemas/agent.v1.AgentVersion'
        created:
          type: boolean
          title: created
          description: created is false when the draft matched the latest version, which is returned instead.
      title: PublishAgentResponse
      additionalProperties: false
    agent.v1.TranscriptionModel:
      type: object
      properties:
        providerId:
          type: string
          title: provider_id
          description: |
            oagent.public_id = true
        model:
          type: string
          title: model
          pattern: ^[A-Za-z0-9._:/-]+$
          description: |
            agent.transcription_model.model.max_len.128
        providerMissing:
          type: boolean
          title: provider_missing
      title: TranscriptionModel
      required:
        - model
      additionalProperties: false
      description: TranscriptionModel turns the end user's voice notes into text with a speech-to-text model on any provider of the project; unset turns voice notes off, and provider_missing is set when the provider no longer resolves.
    agent.v1.UpdateAgentDraftRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
        config:
          title: config
          $ref: '#/components/schemas/agent.v1.AgentConfig'
      title: UpdateAgentDraftRequest
      required:
        - id
        - config
      additionalProperties: false
    agent.v1.UpdateAgentDraftResponse:
      type: object
      properties:
        agent:
          title: agent
          $ref: '#/components/schemas/agent.v1.Agent'
      title: UpdateAgentDraftResponse
      additionalProperties: false
    agent.v1.UpdateAgentRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
        name:
          type: string
          title: name
          description: |
            oagent.name.blank = true
            oagent.name.max_len.200 = true
        description:
          type: string
          title: description
          description: |
            agent.description.max_len.2000
      title: UpdateAgentRequest
      required:
        - id
        - name
      additionalProperties: false
    agent.v1.UpdateAgentResponse:
      type: object
      properties:
        agent:
          title: agent
          $ref: '#/components/schemas/agent.v1.Agent'
      title: UpdateAgentResponse
      additionalProperties: false
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A ProtoJSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a ProtoJSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
