          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.PublishAgentRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent.v1.PublishAgentResponse'
  /agent.v1.AgentService/UpdateAgent:
    post:
      tags:
        - agent.v1.AgentService
      summary: UpdateAgent
      operationId: agent.v1.AgentService.UpdateAgent
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.UpdateAgentRequest'
        required: true
      responses:
