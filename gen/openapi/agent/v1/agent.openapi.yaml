openapi: 3.1.0
info:
  title: agent.v1
paths:
  /agent.v1.AgentService/CreateAgent:
    post:
      tags:
        - agent.v1.AgentService
      summary: CreateAgent
      operationId: agent.v1.AgentService.CreateAgent
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.CreateAgentRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent.v1.CreateAgentResponse'
  /agent.v1.AgentService/DeleteAgent:
    post:
      tags:
        - agent.v1.AgentService
      summary: DeleteAgent
      operationId: agent.v1.AgentService.DeleteAgent
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.DeleteAgentRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent.v1.DeleteAgentResponse'
  /agent.v1.AgentService/GetAgent:
    post:
      tags:
        - agent.v1.AgentService
      summary: GetAgent
      operationId: agent.v1.AgentService.GetAgent
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.GetAgentRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent.v1.GetAgentResponse'
  /agent.v1.AgentService/ListAgentVersions:
    post:
      tags:
        - agent.v1.AgentService
      summary: ListAgentVersions
      operationId: agent.v1.AgentService.ListAgentVersions
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.ListAgentVersionsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent.v1.ListAgentVersionsResponse'
  /agent.v1.AgentService/ListAgents:
    post:
      tags:
        - agent.v1.AgentService
      summary: ListAgents
      operationId: agent.v1.AgentService.ListAgents
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent.v1.ListAgentsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent.v1.ListAgentsResponse'
  /agent.v1.AgentService/PublishAgent:
    post:
      tags:
        - agent.v1.AgentService
      summary: PublishAgent
      operationId: agent.v1.AgentService.PublishAgent
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
