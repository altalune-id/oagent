        title:
          type: string
          title: title
        url:
          type: string
          title: url
        status:
          title: status
          $ref: '#/components/schemas/knowledge.v1.KnowledgeDocumentStatus'
        failure:
          oneOf:
            - $ref: '#/components/schemas/knowledge.v1.KnowledgeFailure'
            - type: "null"
          title: failure
        pageCount:
          type: integer
          title: page_count
          format: int32
        embedTokens:
          type:
            - integer
            - string
          title: embed_tokens
          format: int64
        embedCostMicros:
          type:
            - integer
            - string
          title: embed_cost_micros
          format: int64
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        sizeBytes:
          type:
            - integer
            - string
          title: size_bytes
          format: int64
          description: size_bytes is the uploaded file's size; 0 for a crawled page.
        chunkCount:
          type: integer
          title: chunk_count
          format: int32
      title: KnowledgeDocument
      additionalProperties: false
      description: KnowledgeDocument is one uploaded file or crawled page.
    knowledge.v1.KnowledgeDocumentStatus:
      type: string
      title: KnowledgeDocumentStatus
      enum:
        - KNOWLEDGE_DOCUMENT_STATUS_UNSPECIFIED
        - KNOWLEDGE_DOCUMENT_STATUS_UPLOADING
        - KNOWLEDGE_DOCUMENT_STATUS_PENDING
        - KNOWLEDGE_DOCUMENT_STATUS_PROCESSING
        - KNOWLEDGE_DOCUMENT_STATUS_READY
        - KNOWLEDGE_DOCUMENT_STATUS_FAILED
      description: KnowledgeDocumentStatus is where a document is in ingestion.
    knowledge.v1.KnowledgeFailure:
      type: object
      properties:
        code:
          type: string
          title: code
        reason:
          type: string
          title: reason
      title: KnowledgeFailure
      additionalProperties: false
      description: KnowledgeFailure is the error code, and its reason if any, that failed a source or a document.
    knowledge.v1.KnowledgeHit:
      type: object
      properties:
        text:
          type: string
          title: text
        title:
          type: string
          title: title
        heading:
          type: string
          title: heading
        page:
          type: integer
          title: page
          format: int32
        url:
          type: string
          title: url
        score:
          type: number
          title: score
          format: double
      title: KnowledgeHit
      additionalProperties: false
      description: KnowledgeHit is one passage a search found; score is the cosine similarity.
    knowledge.v1.KnowledgeSource:
      type: object
      properties:
        id:
          type: string
          title: id
        orgId:
          type: string
          title: org_id
        projectId:
          type: string
          title: project_id
        kind:
          title: kind
          $ref: '#/components/schemas/knowledge.v1.KnowledgeSourceKind'
        backend:
          title: backend
          $ref: '#/components/schemas/knowledge.v1.KnowledgeBackend'
        name:
          type: string
          title: name
        seedUrl:
          type: string
          title: seed_url
        status:
          title: status
          $ref: '#/components/schemas/knowledge.v1.KnowledgeSourceStatus'
        failure:
          oneOf:
            - $ref: '#/components/schemas/knowledge.v1.KnowledgeFailure'
            - type: "null"
          title: failure
        documentCount:
          type: integer
          title: document_count
          format: int32
        readyCount:
          type: integer
          title: ready_count
          format: int32
        failedCount:
          type: integer
          title: failed_count
          format: int32
        usedBy:
          type: array
          items:
            $ref: '#/components/schemas/knowledge.v1.KnowledgeUsedBy'
          title: used_by
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: KnowledgeSource
      additionalProperties: false
      description: KnowledgeSource is a named set of documents in a project.
    knowledge.v1.KnowledgeSourceKind:
      type: string
      title: KnowledgeSourceKind
      enum:
        - KNOWLEDGE_SOURCE_KIND_UNSPECIFIED
        - KNOWLEDGE_SOURCE_KIND_UPLOAD
        - KNOWLEDGE_SOURCE_KIND_URL
      description: KnowledgeSourceKind says where a source's documents come from.
    knowledge.v1.KnowledgeSourceStatus:
      type: string
      title: KnowledgeSourceStatus
      enum:
        - KNOWLEDGE_SOURCE_STATUS_UNSPECIFIED
        - KNOWLEDGE_SOURCE_STATUS_IDLE
        - KNOWLEDGE_SOURCE_STATUS_CRAWLING
        - KNOWLEDGE_SOURCE_STATUS_FAILED
      description: KnowledgeSourceStatus is where a source's crawl is; an upload source stays idle.
    knowledge.v1.KnowledgeUsedBy:
      type: object
      properties:
        agentId:
          type: string
          title: agent_id
        agentName:
          type: string
          title: agent_name
      title: KnowledgeUsedBy
      additionalProperties: false
      description: KnowledgeUsedBy names an agent whose published version searches a source.
    knowledge.v1.ListKnowledgeDocumentsRequest:
      type: object
      properties:
        sourceId:
          type: string
          title: source_id
          description: |
            oagent.public_id = true
      title: ListKnowledgeDocumentsRequest
      required:
        - sourceId
      additionalProperties: false
    knowledge.v1.ListKnowledgeDocumentsResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/knowledge.v1.KnowledgeDocument'
          title: documents
      title: ListKnowledgeDocumentsResponse
      additionalProperties: false
    knowledge.v1.ListKnowledgeSourcesRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
      title: ListKnowledgeSourcesRequest
      required:
        - projectId
      additionalProperties: false
    knowledge.v1.ListKnowledgeSourcesResponse:
      type: object
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/knowledge.v1.KnowledgeSource'
          title: sources
        storageConfigured:
          type: boolean
          title: storage_configured
          description: 'storage_configured is false when this server has no object storage: upload sources can''t take files.'
        enabledBackends:
          type: array
          items:
            $ref: '#/components/schemas/knowledge.v1.KnowledgeBackend'
          title: enabled_backends
        embeddingModel:
          oneOf:
            - $ref: '#/components/schemas/knowledge.v1.EmbeddingModel'
            - type: "null"
          title: embedding_model
          description: embedding_model is unset until the project picks one; documents wait until then.
        maxUploadBytes:
          type:
            - integer
            - string
          title: max_upload_bytes
          format: int64
          description: max_upload_bytes and allowed_content_types are what BeginUpload accepts.
        allowedContentTypes:
          type: array
          items:
            type: string
          title: allowed_content_types
        retrievalDefaults:
          title: retrieval_defaults
          description: retrieval_defaults are the recommended agent retrieval tuning, its ranges and its presets.
          $ref: '#/components/schemas/knowledge.v1.RetrievalDefaults'
      title: ListKnowledgeSourcesResponse
      additionalProperties: false
    knowledge.v1.RefreshKnowledgeSourceRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
      title: RefreshKnowledgeSourceRequest
      required:
        - id
      additionalProperties: false
    knowledge.v1.RefreshKnowledgeSourceResponse:
      type: object
      properties:
        source:
          title: source
          $ref: '#/components/schemas/knowledge.v1.KnowledgeSource'
      title: RefreshKnowledgeSourceResponse
      additionalProperties: false
    knowledge.v1.RetrievalDefaults:
      type: object
      properties:
        topK:
          type: integer
          title: top_k
          format: int32
        minScore:
          type: number
          title: min_score
          format: double
        maxTokens:
          type: integer
          title: max_tokens
          format: int32
        minTopK:
          type: integer
          title: min_top_k
          format: int32
        maxTopK:
          type: integer
          title: max_top_k
          format: int32
        minMinScore:
          type: number
          title: min_min_score
          format: double
        maxMinScore:
          type: number
          title: max_min_score
          format: double
        minMaxTokens:
          type: integer
          title: min_max_tokens
          format: int32
        maxMaxTokens:
          type: integer
          title: max_max_tokens
          format: int32
        presets:
          type: array
          items:
            $ref: '#/components/schemas/knowledge.v1.RetrievalPreset'
          title: presets
      title: RetrievalDefaults
      additionalProperties: false
      description: RetrievalDefaults are the recommended values for an agent's knowledge tuning, the allowed ranges and the named presets.
    knowledge.v1.RetrievalPreset:
      type: object
      properties:
        name:
          type: string
          title: name
        topK:
          type: integer
          title: top_k
          format: int32
        minScore:
          type: number
          title: min_score
          format: double
      title: RetrievalPreset
      additionalProperties: false
      description: 'RetrievalPreset is a named tuning: top_k passages per answer at min_score minimum relevance.'
    knowledge.v1.SetEmbeddingModelRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
        providerId:
          type: string
          title: provider_id
          description: |
            oagent.public_id = true
        model:
          type: string
          title: model
          pattern: ^[A-Za-z0-9._:/-]+$
          description: |
            knowledge.model.max_len.128
      title: SetEmbeddingModelRequest
      required:
        - projectId
        - providerId
        - model
      additionalProperties: false
    knowledge.v1.SetEmbeddingModelResponse:
      type: object
      properties:
        embeddingModel:
          title: embedding_model
          $ref: '#/components/schemas/knowledge.v1.EmbeddingModel'
      title: SetEmbeddingModelResponse
      additionalProperties: false
    knowledge.v1.SignedUpload:
      type: object
      properties:
        url:
          type: string
          title: url
        method:
          type: string
          title: method
        headers:
          type: object
          title: headers
          additionalProperties:
            type: string
            title: value
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: SignedUpload
      additionalProperties: false
      description: 'SignedUpload is where the browser PUTs the file: the method, the URL and the exact headers to send.'
    knowledge.v1.SignedUpload.HeadersEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: HeadersEntry
      additionalProperties: false
    knowledge.v1.TestSearchRequest:
      type: object
      properties:
        sourceId:
          type: string
          title: source_id
          description: |
            oagent.public_id = true
        query:
          type: string
          title: query
          description: |
            knowledge.query.blank
            knowledge.query.max_len.2000
      title: TestSearchRequest
      required:
        - sourceId
        - query
      additionalProperties: false
    knowledge.v1.TestSearchResponse:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/knowledge.v1.KnowledgeHit'
          title: hits
      title: TestSearchResponse
      additionalProperties: false
security: []
tags:
  - name: knowledge.v1.KnowledgeService
    description: 'KnowledgeService manages a project''s knowledge sources, their documents and the embedding model agents search them with. Every id is a public id; file bytes never pass through it: a browser uploads them straight to storage.'
