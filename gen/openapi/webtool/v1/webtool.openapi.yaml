components:
  schemas:
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A ProtoJSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a ProtoJSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    webtool.v1.DeleteHTTPSecretRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
      title: DeleteHTTPSecretRequest
      required:
        - id
      additionalProperties: false
    webtool.v1.DeleteHTTPSecretResponse:
      type: object
      title: DeleteHTTPSecretResponse
      additionalProperties: false
    webtool.v1.DeleteWebSearchProviderRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
      title: DeleteWebSearchProviderRequest
      required:
        - projectId
      additionalProperties: false
    webtool.v1.DeleteWebSearchProviderResponse:
      type: object
      title: DeleteWebSearchProviderResponse
      additionalProperties: false
    webtool.v1.GetWebSearchProviderRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
      title: GetWebSearchProviderRequest
      required:
        - projectId
      additionalProperties: false
    webtool.v1.GetWebSearchProviderResponse:
      type: object
      properties:
        provider:
          oneOf:
            - $ref: '#/components/schemas/webtool.v1.WebSearchProvider'
            - type: "null"
          title: provider
        availableKinds:
          type: array
          items:
            $ref: '#/components/schemas/webtool.v1.WebSearchProviderKind'
          title: available_kinds
        usedBy:
          type: array
          items:
            $ref: '#/components/schemas/webtool.v1.UsedBy'
          title: used_by
      title: GetWebSearchProviderResponse
      additionalProperties: false
      description: GetWebSearchProviderResponse holds the project's provider, unset when none, the kinds this deployment offers (a stored kind missing from them no longer searches) and the agents whose latest published version has web search on.
    webtool.v1.HTTPSecret:
      type: object
      properties:
        id:
          type: string
          title: id
        host:
          type: string
          title: host
        header:
          type: string
          title: header
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: HTTPSecret
      additionalProperties: false
      description: HTTPSecret is a header value http_request attaches on calls to host; the value is never returned.
    webtool.v1.ListHTTPSecretsRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
      title: ListHTTPSecretsRequest
      required:
        - projectId
      additionalProperties: false
    webtool.v1.ListHTTPSecretsResponse:
      type: object
      properties:
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/webtool.v1.HTTPSecret'
          title: secrets
      title: ListHTTPSecretsResponse
      additionalProperties: false
    webtool.v1.SetHTTPSecretRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
        host:
          type: string
          title: host
          maxLength: 253
          pattern: ^[a-z0-9.-]+$
        header:
          type: string
          title: header
          pattern: ^[!#$%&'*+.^_`|~0-9A-Za-z-]{1,64}$
        value:
          type: string
          title: value
          maxLength: 4096
          description: 'value is write-only: it is sealed at rest and never returned.'
      title: SetHTTPSecretRequest
      required:
        - projectId
        - host
        - header
        - value
      additionalProperties: false
      description: SetHTTPSecretRequest stores the value for a host and header of the project, replacing any stored one; the header name is stored lowercase.
    webtool.v1.SetHTTPSecretResponse:
      type: object
      properties:
        secret:
          title: secret
          $ref: '#/components/schemas/webtool.v1.HTTPSecret'
      title: SetHTTPSecretResponse
      additionalProperties: false
    webtool.v1.SetWebSearchProviderRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
        kind:
          title: kind
          $ref: '#/components/schemas/webtool.v1.WebSearchProviderKind'
        apiKey:
          type:
            - string
            - "null"
          title: api_key
          maxLength: 512
          minLength: 1
          description: 'api_key is write-only: it is sealed at rest and never returned.'
        pricePerCallMicros:
          type:
            - integer
            - string
            - "null"
          title: price_per_call_micros
          minimum: 0
          format: int64
          description: price_per_call_micros is micro-USD per search call; 0 is free.
      title: SetWebSearchProviderRequest
      required:
        - projectId
        - kind
        - pricePerCallMicros
      additionalProperties: false
      description: SetWebSearchProviderRequest sets the project's provider; api_key is required when the project has none or the kind changes, and leaving it unset keeps the stored key.
    webtool.v1.SetWebSearchProviderResponse:
      type: object
      properties:
        provider:
          title: provider
          $ref: '#/components/schemas/webtool.v1.WebSearchProvider'
      title: SetWebSearchProviderResponse
      additionalProperties: false
    webtool.v1.UsedBy:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
      title: UsedBy
      additionalProperties: false
      description: UsedBy names an agent by its public id and name.
    webtool.v1.WebSearchProvider:
      type: object
      properties:
        kind:
          title: kind
          $ref: '#/components/schemas/webtool.v1.WebSearchProviderKind'
        keySet:
          type: boolean
          title: key_set
        pricePerCallMicros:
          type:
            - integer
            - string
          title: price_per_call_micros
          format: int64
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: WebSearchProvider
      additionalProperties: false
      description: WebSearchProvider is a project's search provider; key_set says whether a key is stored, and the key is never returned. price_per_call_micros is micro-USD per search call.
    webtool.v1.WebSearchProviderKind:
      type: string
      title: WebSearchProviderKind
      enum:
        - WEB_SEARCH_PROVIDER_KIND_UNSPECIFIED
        - WEB_SEARCH_PROVIDER_KIND_BRAVE
        - WEB_SEARCH_PROVIDER_KIND_EXA
        - WEB_SEARCH_PROVIDER_KIND_TAVILY
      description: WebSearchProviderKind is the search API a project's web_search calls.
security: []
tags:
  - name: webtool.v1.WebToolService
    description: WebToolService manages a project's web search provider and the HTTP secrets its agents' http_request calls attach. Every id is a public id; keys and secret values are write-only, and no RPC has an MCP tool.
