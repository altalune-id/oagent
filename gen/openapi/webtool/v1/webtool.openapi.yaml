info:
  title: webtool.v1
paths:
  /webtool.v1.WebToolService/DeleteHTTPSecret:
    post:
      tags:
        - webtool.v1.WebToolService
      summary: DeleteHTTPSecret
      operationId: webtool.v1.WebToolService.DeleteHTTPSecret
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webtool.v1.DeleteHTTPSecretRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webtool.v1.DeleteHTTPSecretResponse'
