openapi: 3.1.0
info:
  title: modelprovider.v1
paths:
  /modelprovider.v1.ModelProviderService/CreateModelProvider:
    post:
      tags:
        - modelprovider.v1.ModelProviderService
      summary: CreateModelProvider
      operationId: modelprovider.v1.ModelProviderService.CreateModelProvider
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelprovider.v1.CreateModelProviderRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelprovider.v1.CreateModelProviderResponse'
  /modelprovider.v1.ModelProviderService/DeleteModelProvider:
    post:
      tags:
        - modelprovider.v1.ModelProviderService
      summary: DeleteModelProvider
      operationId: modelprovider.v1.ModelProviderService.DeleteModelProvider
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelprovider.v1.DeleteModelProviderRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelprovider.v1.DeleteModelProviderResponse'
  /modelprovider.v1.ModelProviderService/GetModelProvider:
    post:
      tags:
        - modelprovider.v1.ModelProviderService
      summary: GetModelProvider
      operationId: modelprovider.v1.ModelProviderService.GetModelProvider
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelprovider.v1.GetModelProviderRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelprovider.v1.GetModelProviderResponse'
  /modelprovider.v1.ModelProviderService/ListModelProviders:
    post:
      tags:
        - modelprovider.v1.ModelProviderService
      summary: ListModelProviders
      operationId: modelprovider.v1.ModelProviderService.ListModelProviders
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelprovider.v1.ListModelProvidersRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelprovider.v1.ListModelProvidersResponse'
  /modelprovider.v1.ModelProviderService/UpdateModelProvider:
    post:
      tags:
        - modelprovider.v1.ModelProviderService
      summary: UpdateModelProvider
      operationId: modelprovider.v1.ModelProviderService.UpdateModelProvider
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelprovider.v1.UpdateModelProviderRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelprovider.v1.UpdateModelProviderResponse'
components:
  schemas:
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A ProtoJSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a ProtoJSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    modelprovider.v1.CreateModelProviderRequest:
      type: object
      properties:
        orgId:
          type: string
          title: org_id
          description: |
            oagent.public_id = true
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
        name:
          type: string
          title: name
          description: |
            oagent.name.blank = true
            oagent.name.max_len.200 = true
        kind:
          title: kind
          $ref: '#/components/schemas/modelprovider.v1.ModelProviderKind'
        baseUrl:
          type: string
          title: base_url
          description: |
            modelprovider.base_url.format
            modelprovider.base_url.max_len.2048
        apiKey:
          type: string
          title: api_key
          maxLength: 512
          minLength: 1
          description: 'api_key is write-only: it is sealed at rest and never returned.'
        models:
          type: array
          items:
            $ref: '#/components/schemas/modelprovider.v1.Model'
          title: models
          maxItems: 64
          minItems: 1
          description: |
            modelprovider.models.unique
      title: CreateModelProviderRequest
      required:
        - orgId
        - projectId
        - name
        - kind
        - baseUrl
        - apiKey
      additionalProperties: false
    modelprovider.v1.CreateModelProviderResponse:
      type: object
      properties:
        modelProvider:
          title: model_provider
          $ref: '#/components/schemas/modelprovider.v1.ModelProvider'
      title: CreateModelProviderResponse
      additionalProperties: false
    modelprovider.v1.DeleteModelProviderRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
      title: DeleteModelProviderRequest
      required:
        - id
      additionalProperties: false
    modelprovider.v1.DeleteModelProviderResponse:
      type: object
      title: DeleteModelProviderResponse
      additionalProperties: false
    modelprovider.v1.GetModelProviderRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
      title: GetModelProviderRequest
      required:
        - id
      additionalProperties: false
    modelprovider.v1.GetModelProviderResponse:
      type: object
      properties:
        modelProvider:
          title: model_provider
          $ref: '#/components/schemas/modelprovider.v1.ModelProvider'
      title: GetModelProviderResponse
      additionalProperties: false
    modelprovider.v1.ListModelProvidersRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
      title: ListModelProvidersRequest
      required:
        - projectId
      additionalProperties: false
    modelprovider.v1.ListModelProvidersResponse:
      type: object
      properties:
        modelProviders:
          type: array
          items:
            $ref: '#/components/schemas/modelprovider.v1.ModelProvider'
          title: model_providers
      title: ListModelProvidersResponse
      additionalProperties: false
    modelprovider.v1.Model:
      type: object
      properties:
        id:
          type: string
          title: id
          pattern: ^[A-Za-z0-9._:/-]+$
          description: |
            modelprovider.model.max_len.128
        vision:
          type: boolean
          title: vision
        prices:
          oneOf:
            - $ref: '#/components/schemas/modelprovider.v1.ModelPrices'
            - type: "null"
          title: prices
          description: prices are micro-USD per 1M tokens.
      title: Model
      required:
        - id
      additionalProperties: false
      description: Model is one model a provider serves; without prices it is unpriced, and an agent with a cost limit cannot use it.
    modelprovider.v1.ModelPrices:
      type: object
      properties:
        inputMicros:
          type:
            - integer
            - string
          title: input_micros
          minimum: 0
          format: int64
        outputMicros:
          type:
            - integer
            - string
          title: output_micros
          minimum: 0
          format: int64
        cacheReadMicros:
          type:
            - integer
            - string
          title: cache_read_micros
          minimum: 0
          format: int64
        cacheWriteMicros:
          type:
            - integer
            - string
          title: cache_write_micros
          minimum: 0
          format: int64
      title: ModelPrices
      additionalProperties: false
      description: ModelPrices are integer micro-USD per 1M tokens, per token class, in the platform currency USD. Cost micros are ceil(tokens x price / 1 000 000) per class, summed; cents are ceil(micros / 10 000).
    modelprovider.v1.ModelProvider:
      type: object
      properties:
        id:
          type: string
          title: id
        orgId:
          type: string
          title: org_id
        projectId:
          type: string
          title: project_id
        name:
          type: string
          title: name
        kind:
          title: kind
          $ref: '#/components/schemas/modelprovider.v1.ModelProviderKind'
        baseUrl:
          type: string
          title: base_url
        apiKeySet:
          type: boolean
          title: api_key_set
        models:
          type: array
          items:
            $ref: '#/components/schemas/modelprovider.v1.Model'
          title: models
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ModelProvider
      additionalProperties: false
      description: ModelProvider is a model endpoint of a project; api_key_set says whether a key is stored, and the key is never returned.
    modelprovider.v1.ModelProviderKind:
      type: string
      title: ModelProviderKind
      enum:
        - MODEL_PROVIDER_KIND_UNSPECIFIED
        - MODEL_PROVIDER_KIND_OPENAI_COMPATIBLE
      description: ModelProviderKind is the wire protocol a provider speaks.
    modelprovider.v1.UpdateModelProviderRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
        name:
          type: string
          title: name
          description: |
            oagent.name.blank = true
            oagent.name.max_len.200 = true
        kind:
          title: kind
          $ref: '#/components/schemas/modelprovider.v1.ModelProviderKind'
        baseUrl:
          type: string
          title: base_url
          description: |
            modelprovider.base_url.format
            modelprovider.base_url.max_len.2048
        apiKey:
          type:
            - string
            - "null"
          title: api_key
          maxLength: 512
          minLength: 1
          description: 'api_key is write-only: it is sealed at rest and never returned.'
        models:
          type: array
          items:
            $ref: '#/components/schemas/modelprovider.v1.Model'
          title: models
          maxItems: 64
          minItems: 1
          description: |
            modelprovider.models.unique
      title: UpdateModelProviderRequest
      required:
        - id
        - name
        - kind
        - baseUrl
      additionalProperties: false
      description: UpdateModelProviderRequest replaces a provider's editable fields; leaving api_key unset keeps the stored key, which a base_url change refuses.
    modelprovider.v1.UpdateModelProviderResponse:
      type: object
      properties:
        modelProvider:
          title: model_provider
          $ref: '#/components/schemas/modelprovider.v1.ModelProvider'
      title: UpdateModelProviderResponse
      additionalProperties: false
security: []
tags:
  - name: modelprovider.v1.ModelProviderService
    description: ModelProviderService manages the model providers a project's agents call. Every id is a public id; an API key is write-only, and the RPCs that take one have no MCP tool.
