info:
  title: memory.v1
paths:
  /memory.v1.MemoryService/ClearMemories:
    post:
      tags:
        - memory.v1.MemoryService
      summary: ClearMemories
      operationId: memory.v1.MemoryService.ClearMemories
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/memory.v1.ClearMemoriesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/memory.v1.ClearMemoriesResponse'
