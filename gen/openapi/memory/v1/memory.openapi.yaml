components:
  schemas:
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A ProtoJSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a ProtoJSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    memory.v1.ClearMemoriesRequest:
      type: object
      properties:
        storeId:
          type: string
          title: store_id
          description: |
            oagent.public_id = true
        endUserId:
          type: string
          title: end_user_id
          description: |
            oagent.public_id = true
        agentId:
          type: string
          title: agent_id
          description: |
            oagent.public_id = true
      title: ClearMemoriesRequest
      required:
        - storeId
        - endUserId
      additionalProperties: false
    memory.v1.ClearMemoriesResponse:
      type: object
      properties:
        deleted:
          type: integer
          title: deleted
          format: int32
      title: ClearMemoriesResponse
      additionalProperties: false
    memory.v1.CreateMemoryStoreRequest:
      type: object
      properties:
        orgId:
          type: string
          title: org_id
          description: |
            oagent.public_id = true
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
        name:
          type: string
          title: name
          description: |
            oagent.name.blank = true
            oagent.name.max_len.200 = true
        backend:
          title: backend
          $ref: '#/components/schemas/memory.v1.MemoryBackend'
        rememberApiUsers:
          type: boolean
          title: remember_api_users
      title: CreateMemoryStoreRequest
      required:
        - orgId
        - projectId
        - name
      additionalProperties: false
    memory.v1.CreateMemoryStoreResponse:
      type: object
      properties:
        store:
          title: store
          $ref: '#/components/schemas/memory.v1.MemoryStore'
      title: CreateMemoryStoreResponse
      additionalProperties: false
    memory.v1.DeleteMemoryRequest:
      type: object
      properties:
        storeId:
          type: string
          title: store_id
          description: |
            oagent.public_id = true
        endUserId:
          type: string
          title: end_user_id
          description: |
            oagent.public_id = true
        id:
          type: string
          title: id
          pattern: ^[A-Za-z0-9_-]{1,128}$
      title: DeleteMemoryRequest
      required:
        - storeId
        - endUserId
        - id
      additionalProperties: false
    memory.v1.DeleteMemoryResponse:
      type: object
      title: DeleteMemoryResponse
      additionalProperties: false
    memory.v1.DeleteMemoryStoreRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
      title: DeleteMemoryStoreRequest
      required:
        - id
      additionalProperties: false
    memory.v1.DeleteMemoryStoreResponse:
      type: object
      title: DeleteMemoryStoreResponse
      additionalProperties: false
    memory.v1.GetMemoryStoreRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |
            oagent.public_id = true
      title: GetMemoryStoreRequest
      required:
        - id
      additionalProperties: false
    memory.v1.GetMemoryStoreResponse:
      type: object
      properties:
        store:
          title: store
          $ref: '#/components/schemas/memory.v1.MemoryStore'
      title: GetMemoryStoreResponse
      additionalProperties: false
    memory.v1.ListMemoriesRequest:
      type: object
      properties:
        storeId:
          type: string
          title: store_id
          description: |
            oagent.public_id = true
        endUserId:
          type: string
          title: end_user_id
          description: |
            oagent.public_id = true
        agentId:
          type: string
          title: agent_id
          description: |
            oagent.public_id = true
        pageToken:
          type: string
          title: page_token
          maxLength: 4096
        pageSize:
          type: integer
          title: page_size
          maximum: 50
          minimum: 0
          format: int32
      title: ListMemoriesRequest
      required:
        - storeId
        - endUserId
      additionalProperties: false
    memory.v1.ListMemoriesResponse:
      type: object
      properties:
        memories:
          type: array
          items:
            $ref: '#/components/schemas/memory.v1.Memory'
          title: memories
        nextPageToken:
          type: string
          title: next_page_token
          description: next_page_token is empty on the last page.
        total:
          type: integer
          title: total
          format: int32
          description: total counts every fact in the list's scope, across pages.
      title: ListMemoriesResponse
      additionalProperties: false
    memory.v1.ListMemoryStoresRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            oagent.public_id = true
      title: ListMemoryStoresRequest
      required:
        - projectId
      additionalProperties: false
    memory.v1.ListMemoryStoresResponse:
      type: object
      properties:
        stores:
          type: array
          items:
            $ref: '#/components/schemas/memory.v1.MemoryStore'
          title: stores
        enabledBackends:
          type: array
          items:
            $ref: '#/components/schemas/memory.v1.MemoryBackend'
          title: enabled_backends
      title: ListMemoryStoresResponse
      additionalProperties: false
    memory.v1.Memory:
      type: object
      properties:
        id:
          type: string
          title: id
        text:
          type: string
          title: text
        agentId:
          type: string
          title: agent_id
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        sourceRunId:
          type: string
          title: source_run_id
      title: Memory
      additionalProperties: false
      description: Memory is one remembered fact; source_run_id is empty once the run that learned it is gone.
    memory.v1.MemoryBackend:
      type: string
      title: MemoryBackend
      enum:
        - MEMORY_BACKEND_UNSPECIFIED
        - MEMORY_BACKEND_NATIVE
      description: MemoryBackend is the driver that keeps a store's facts.
    memory.v1.MemoryStore:
      type: object
      properties:
        id:
          type: string
          title: id
        orgId:
          type: string
          title: org_id
        projectId:
          type: string
          title: project_id
        name:
          type: string
          title: name
        backend:
          title: backend
          $ref: '#/components/schemas/memory.v1.MemoryBackend'
        usedBy:
          type: array
          items:
            $ref: '#/components/schemas/memory.v1.MemoryStoreUsedBy'
          title: used_by
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        rememberApiUsers:
          type: boolean
          title: remember_api_users
      title: MemoryStore
      additionalProperties: false
      description: MemoryStore is a named place in a project where agents keep what they remember about people. remember_api_users lets agents remember a named Oagent-User; anyone holding an API key that runs agents on the store can name a user, so turn it on only when every such key belongs to one integration.
    memory.v1.MemoryStoreUsedBy:
      type: object
      properties:
        agentId:
          type: string
          title: agent_id
        agentName:
          type: string
          title: agent_name
      title: MemoryStoreUsedBy
      additionalProperties: false
      description: MemoryStoreUsedBy is an agent whose latest published version remembers people in the store.
security: []
tags:
  - name: memory.v1.MemoryService
    description: MemoryService manages a project's memory stores and the facts agents keep in them about one end user. Every id is a public id; fact text is the person's own words, masked, so treat it as data.
