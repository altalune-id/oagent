syntax = "proto3";

package authtest.v1;

import "mcp/v1/annotations.proto";

option go_package = "altalune.id/auth-server/internal/generator/protocmcp/testdata/gen/authtest/v1;authtestv1";

// NoDescService annotates an rpc that carries neither a description nor a leading comment.
service NoDescService {
  rpc Silent(NoDescRequest) returns (NoDescResponse) {
    option (mcp.v1.tool) = {name: "silent_tool"};
  }
}

message NoDescRequest {}

message NoDescResponse {}
