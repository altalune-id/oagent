syntax = "proto3";

package authtest.v1;

import "mcp/v1/annotations.proto";

option go_package = "altalune.id/auth-server/internal/generator/protocmcp/testdata/gen/authtest/v1;authtestv1";

service BadEchoService {
  // EchoTwice claims a tool name another file already claims.
  rpc EchoTwice(BadEchoRequest) returns (BadEchoResponse) {
    option (mcp.v1.tool) = {name: "poke_target"};
  }
}

message BadEchoRequest {}

message BadEchoResponse {}
