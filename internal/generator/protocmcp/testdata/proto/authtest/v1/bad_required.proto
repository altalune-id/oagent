syntax = "proto3";

package authtest.v1;

import "mcp/v1/annotations.proto";

option go_package = "altalune.id/auth-server/internal/generator/protocmcp/testdata/gen/authtest/v1;authtestv1";

service BadRequiredService {
  rpc RequireGhost(BadRequiredRequest) returns (BadRequiredResponse) {
    option (mcp.v1.tool) = {
      name: "require_ghost"
      required: ["ghostField"]
    };
  }
}

message BadRequiredRequest {
  string project_id = 1;
}

message BadRequiredResponse {}
