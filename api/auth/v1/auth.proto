syntax = "proto3";

package auth.v1;

import "mcp/v1/annotations.proto";

option go_package = "altalune.id/oagent/gen/go/auth/v1;authv1";

service AuthService {
  // Whoami describes the credential the request was made with.
  rpc Whoami(WhoamiRequest) returns (WhoamiResponse) {
    option (mcp.v1.tool) = {
      name: "auth_whoami"
      description: "Who this MCP client acts as: user or key, active org, permissions."
      ui: "app"
    };
  }
}

message WhoamiRequest {}

// Every id is a public id.
message WhoamiResponse {
  // local, basic, apikey or system.
  string source = 1;
  string user_id = 2;
  string email = 3;
  string name = 4;
  string avatar_url = 5;
  reserved 6;
  reserved "key_id";
  // Set for API keys: the last 4 characters of the key's secret.
  string key_hint = 13;
  // Personal keys: the person the key acts for.
  string owner_id = 7;
  string active_org_id = 8;
  string active_org_slug = 9;
  string active_project_id = 10;
  // Effective permissions after roles, key scopes and grants are intersected.
  repeated string permissions = 11;
  bool operator = 12;
}
