syntax = "proto3";

package agent.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "mcp/v1/annotations.proto";
import "oagent/v1/rules.proto";

option go_package = "altalune.id/oagent/gen/go/agent/v1;agentv1";

// AgentService manages agents. Every id is a public id.
service AgentService {
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse) {
    option (mcp.v1.tool) = {
      name: "agent_create"
      description: "Create an agent within a project, minting a slug when one is not supplied."
      mutation: true
      destructive: false
      ui: "app"
    };
  }
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
    option (mcp.v1.tool) = {
      name: "agent_get"
      description: "Get an agent by id."
      required: ["id"]
      ui: "app"
    };
  }
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option (mcp.v1.tool) = {
      name: "agent_list"
      description: "List agents in a project."
      required: ["project_id"]
      ui: "app"
    };
  }
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse) {
    option (mcp.v1.tool) = {
      name: "agent_update"
      description: "Update an agent's name and description."
      required: ["id", "name"]
      mutation: true
      destructive: false
      ui: "app"
    };
  }
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse) {
    option (mcp.v1.tool) = {
      name: "agent_delete"
      description: "Delete an agent by id."
      required: ["id"]
      mutation: true
      destructive: true
      ui: "app"
    };
  }
  rpc UpdateAgentDraft(UpdateAgentDraftRequest) returns (UpdateAgentDraftResponse) {
    option (mcp.v1.tool) = {
      name: "agent_update_draft"
      description: "Replace an agent's draft configuration: instructions, model, temperature, tools, max steps and budget. The published version is unchanged until agent_publish."
      required: ["id", "config"]
      mutation: true
      destructive: false
      ui: "app"
    };
  }
  rpc PublishAgent(PublishAgentRequest) returns (PublishAgentResponse) {
    option (mcp.v1.tool) = {
      name: "agent_publish"
      description: "Publish an agent's draft as its next immutable version; an unchanged draft returns the latest version and creates none."
      required: ["id"]
      mutation: true
      destructive: false
      ui: "app"
    };
  }
  rpc ListAgentVersions(ListAgentVersionsRequest) returns (ListAgentVersionsResponse) {
    option (mcp.v1.tool) = {
      name: "agent_version_list"
      description: "List an agent's published versions, newest first."
      required: ["agent_id"]
      ui: "app"
    };
  }
}

message Agent {
  reserved 2;
  reserved "public_id";
  string id = 1;
  string org_id = 3;
  string project_id = 4;
  string slug = 5;
  string name = 6;
  string description = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  AgentConfig draft = 10;
  // published_version is the latest version's number, 0 when the agent was never published.
  int32 published_version = 11;
  google.protobuf.Timestamp draft_updated_at = 12;
  // unpublished_changes is true when the draft was edited after the last publish.
  bool unpublished_changes = 13;
  // effective_config is the draft with unset values resolved to the current recommended values.
  AgentEffective effective_config = 14;
}

// AgentEffective is what a run uses for a config: unset values resolved to the recommended values current at read time, so it is never stored or frozen per version.
message AgentEffective {
  int32 max_steps = 1;
  int32 knowledge_top_k = 2;
  double knowledge_min_score = 3;
  int32 knowledge_max_tokens = 4;
}

// AgentDefaults are the recommended agent config values and their ranges; the knowledge tuning defaults come from ListKnowledgeSources.
message AgentDefaults {
  int32 max_steps = 1;
  int32 max_max_steps = 2;
  double max_temperature = 3;
  int32 max_cost_cents = 4;
}

// AgentTool is a tool the agent may call; require_approval makes a person approve each call, and free_when lets a call run without asking when every condition holds.
message AgentTool {
  string name = 1 [(buf.validate.field).string.pattern = "^[a-zA-Z0-9_.-]{1,64}$"];
  bool require_approval = 2;
  repeated FreeCondition free_when = 3 [(buf.validate.field).repeated.max_items = 8];
}

// FreeCondition holds when the call's argument arg equals one of values, each a JSON value such as false or "draft", or when the argument is absent and absent is true.
message FreeCondition {
  string arg = 1 [(buf.validate.field).string.pattern = "^[A-Za-z_][A-Za-z0-9_]{0,63}$"];
  repeated string values = 2 [
    (buf.validate.field).repeated.max_items = 16,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_bytes = 256
  ];
  bool absent = 3;
}

// McpGrant lets an agent call the listed tools of one MCP server; missing is output only and true when the server no longer exists.
message McpGrant {
  string server_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(oagent.v1.public_id) = true
  ];
  repeated AgentTool tools = 2 [
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).cel = {id: "agent.grant_tools.unique", expression: "this.map(t, t.name).unique() ? '' : 'tool names must be unique'"}
  ];
  bool missing = 3;
}

// AgentConfig is what an agent runs with; zero values mean the recommended value (max_steps, from GetAgent's defaults) or no limit (max_cost_cents), and tool names are unique. tools is the legacy list a new draft never sets; provider_id is the model provider's public id; provider_missing is output only; knowledge_source_ids are the knowledge sources searched before each turn, leaving out a deleted one, and knowledge_sources_missing is output only: how many bound sources no longer exist. knowledge_tuning shapes that search; unset fields use the recommended values. memory_store_id is the public id of the memory store the agent remembers people in, empty for none; memory_store_missing is output only: the bound store no longer exists.
message AgentConfig {
  string instructions = 1 [
    (buf.validate.field).cel = {id: "agent.instructions.max_len.32000", expression: "this.size() <= 32000 ? '' : 'must be at most 32000 characters'"}
  ];
  string model = 2 [
    (buf.validate.field).cel = {id: "agent.model.max_len.128", expression: "this.size() <= 128 ? '' : 'must be at most 128 characters'"},
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]*$"
  ];
  double temperature = 3 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 2
  ];
  int32 max_steps = 4 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 100
  ];
  int32 max_cost_cents = 5 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 1000000
  ];
  repeated AgentTool tools = 6 [
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).cel = {id: "agent.tools.unique", expression: "this.map(t, t.name).unique() ? '' : 'tool names must be unique'"}
  ];
  string provider_id = 7 [(buf.validate.field).string.(oagent.v1.public_id) = true];
  string helper_model = 8 [
    (buf.validate.field).cel = {id: "agent.helper_model.max_len.128", expression: "this.size() <= 128 ? '' : 'must be at most 128 characters'"},
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]*$"
  ];
  repeated McpGrant mcp_servers = 9 [
    (buf.validate.field).repeated.max_items = 16,
    (buf.validate.field).cel = {id: "agent.mcp_servers.unique", expression: "this.map(g, g.server_id).unique() ? '' : 'server ids must be unique'"}
  ];
  bool provider_missing = 10;
  repeated string knowledge_source_ids = 11 [
    (buf.validate.field).repeated.max_items = 16,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.(oagent.v1.public_id) = true
  ];
  int32 knowledge_sources_missing = 12;
  KnowledgeTuning knowledge_tuning = 13;
  string memory_store_id = 14 [(buf.validate.field).string.(oagent.v1.public_id) = true];
  bool memory_store_missing = 15;
  TranscriptionModel transcription_model = 16;
}

// TranscriptionModel turns the end user's voice notes into text with a speech-to-text model on any provider of the project; unset turns voice notes off, and provider_missing is set when the provider no longer resolves.
message TranscriptionModel {
  string provider_id = 1 [(buf.validate.field).string.(oagent.v1.public_id) = true];
  string model = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {id: "agent.transcription_model.model.max_len.128", expression: "this.size() <= 128 ? '' : 'must be at most 128 characters'"},
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/-]+$"
  ];
  bool provider_missing = 3;
}

// KnowledgeTuning shapes the knowledge search before each turn. top_k is the passages per answer and max_tokens the knowledge budget, 0 meaning the recommended value; min_score is the minimum relevance, unset meaning the recommended value (0 is a valid setting). ListKnowledgeSources returns the recommended values.
message KnowledgeTuning {
  int32 top_k = 1 [
    (buf.validate.field).cel = {id: "agent.knowledge_tuning.top_k.range", expression: "this == 0 || (this >= 1 && this <= 10) ? '' : 'must be 0 or 1 to 10'"}
  ];
  optional double min_score = 2 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 1
  ];
  int32 max_tokens = 3 [
    (buf.validate.field).cel = {id: "agent.knowledge_tuning.max_tokens.range", expression: "this == 0 || (this >= 500 && this <= 8000) ? '' : 'must be 0 or 500 to 8000'"}
  ];
}

// AgentVersion is an immutable published configuration; version is a display label, id the public id.
message AgentVersion {
  string id = 1;
  string agent_id = 2;
  int32 version = 3;
  AgentConfig config = 4;
  google.protobuf.Timestamp created_at = 5;
  // created_by is the publishing person's user public id, empty for an API key.
  string created_by = 6;
  // effective_config is config with unset values resolved to the current recommended values.
  AgentEffective effective_config = 7;
}

message CreateAgentRequest {
  string org_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(oagent.v1.public_id) = true
  ];
  string project_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(oagent.v1.public_id) = true
  ];
  string slug = 3 [
    (buf.validate.field).string.(oagent.v1.slug) = true
  ];
  string name = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(oagent.v1.name) = true
  ];
  string description = 5 [
    (buf.validate.field).cel = {id: "agent.description.max_len.2000", expression: "this.trim().size() <= 2000 ? '' : 'must be at most 2000 characters'"}
  ];
}

message CreateAgentResponse {
  Agent agent = 1;
}

message GetAgentRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(oagent.v1.public_id) = true
  ];
}

message GetAgentResponse {
  Agent agent = 1;
  AgentDefaults defaults = 2;
}

message ListAgentsRequest {
  string project_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(oagent.v1.public_id) = true
  ];
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  AgentDefaults defaults = 2;
}

message UpdateAgentRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(oagent.v1.public_id) = true
  ];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(oagent.v1.name) = true
  ];
  string description = 3 [
    (buf.validate.field).cel = {id: "agent.description.max_len.2000", expression: "this.trim().size() <= 2000 ? '' : 'must be at most 2000 characters'"}
  ];
}

message UpdateAgentResponse {
  Agent agent = 1;
}

message DeleteAgentRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(oagent.v1.public_id) = true
  ];
}

message DeleteAgentResponse {}

message UpdateAgentDraftRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(oagent.v1.public_id) = true
  ];
  AgentConfig config = 2 [(buf.validate.field).required = true];
}

message UpdateAgentDraftResponse {
  Agent agent = 1;
}

message PublishAgentRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(oagent.v1.public_id) = true
  ];
}

message PublishAgentResponse {
  Agent agent = 1;
  AgentVersion version = 2;
  // created is false when the draft matched the latest version, which is returned instead.
  bool created = 3;
}

// ListAgentVersionsRequest lists an agent's versions newest first; limit 0 means the server default of 50, and the most is 100.
message ListAgentVersionsRequest {
  string agent_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(oagent.v1.public_id) = true
  ];
  int32 limit = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 100
  ];
}

message ListAgentVersionsResponse {
  repeated AgentVersion versions = 1;
}
