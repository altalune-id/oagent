syntax = "proto3";

package webhook.v1;

import "google/protobuf/timestamp.proto";
import "mcp/v1/annotations.proto";

option go_package = "altalune.id/oagent/gen/go/webhook/v1;webhookv1";

service WebhookService {
  rpc CreateWebhook(CreateWebhookRequest) returns (CreateWebhookResponse) {
    option (mcp.v1.tool) = {
      name: "webhook_create"
      description: "Create a webhook endpoint for a project, returning its signing secret once."
      mutation: true
      destructive: false
      ui: "app"
    };
  }
  rpc GetWebhook(GetWebhookRequest) returns (GetWebhookResponse);
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse) {
    option (mcp.v1.tool) = {
      name: "webhook_list"
      description: "List a project's webhook endpoints."
      required: ["org_id", "project_id"]
      ui: "app"
    };
  }
  rpc ListWebhookDeliveries(ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse) {
    option (mcp.v1.tool) = {
      name: "webhook_deliveries"
      description: "List recent deliveries of a webhook endpoint, newest first."
      required: ["org_id", "project_id", "id"]
      ui: "app"
    };
  }
  rpc ListWebhookDeliveryAttempts(ListWebhookDeliveryAttemptsRequest) returns (ListWebhookDeliveryAttemptsResponse);
  rpc UpdateWebhook(UpdateWebhookRequest) returns (UpdateWebhookResponse);
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);
  rpc RotateWebhookSecret(RotateWebhookSecretRequest) returns (RotateWebhookSecretResponse);
  rpc PingWebhook(PingWebhookRequest) returns (PingWebhookResponse);
  rpc RetryWebhookDelivery(RetryWebhookDeliveryRequest) returns (RetryWebhookDeliveryResponse);
  rpc RetryFailedWebhookDeliveries(RetryFailedWebhookDeliveriesRequest) returns (RetryFailedWebhookDeliveriesResponse) {
    option (mcp.v1.tool) = {
      name: "webhook_retry_failed"
      description: "Requeue every failed delivery of a webhook endpoint."
      required: ["org_id", "project_id", "id"]
      mutation: true
      destructive: false
      ui: "app"
    };
  }
}

message Webhook {
  string id = 1;
  string public_id = 10;
  string org_id = 2;
  string project_id = 3;
  string url = 4;
  string description = 5;
  repeated string event_types = 6;
  bool active = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateWebhookRequest {
  string org_id = 1;
  string project_id = 2;
  string url = 3;
  string description = 4;
  repeated string event_types = 5;
}

message CreateWebhookResponse {
  Webhook webhook = 1;
  string secret = 2;
}

message GetWebhookRequest {
  string org_id = 1;
  string project_id = 2;
  string id = 3;
}

message GetWebhookResponse {
  Webhook webhook = 1;
}

message ListWebhooksRequest {
  string org_id = 1;
  string project_id = 2;
}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
}

message WebhookDelivery {
  string id = 1;
  string event_id = 2;
  string event_type = 3;
  int32 attempt = 4;
  string status = 5;
  string last_error = 6;
  google.protobuf.Timestamp next_attempt_at = 7;
  google.protobuf.Timestamp created_at = 8;
  string payload = 9;
}

message ListWebhookDeliveriesRequest {
  string org_id = 1;
  string project_id = 2;
  string id = 3;
  int32 limit = 4;
}

message ListWebhookDeliveriesResponse {
  repeated WebhookDelivery deliveries = 1;
}

message WebhookAttempt {
  int32 attempt = 1;
  int32 status_code = 2;
  string error = 3;
  string response_body = 4;
  bool response_truncated = 5;
  int32 duration_ms = 6;
  google.protobuf.Timestamp created_at = 7;
  repeated WebhookResponseHeader response_headers = 8;
}

message WebhookResponseHeader {
  string name = 1;
  string value = 2;
}

message ListWebhookDeliveryAttemptsRequest {
  string org_id = 1;
  string project_id = 2;
  string id = 3;
  string delivery_id = 4;
}

message ListWebhookDeliveryAttemptsResponse {
  repeated WebhookAttempt attempts = 1;
}

message UpdateWebhookRequest {
  string org_id = 1;
  string project_id = 2;
  string id = 3;
  string url = 4;
  string description = 5;
  repeated string event_types = 6;
  bool active = 7;
}

message UpdateWebhookResponse {
  Webhook webhook = 1;
}

message DeleteWebhookRequest {
  string org_id = 1;
  string project_id = 2;
  string id = 3;
}

message DeleteWebhookResponse {}

message RotateWebhookSecretRequest {
  string org_id = 1;
  string project_id = 2;
  string id = 3;
}

message RotateWebhookSecretResponse {
  string secret = 1;
}

message PingWebhookRequest {
  string org_id = 1;
  string project_id = 2;
  string id = 3;
}

message PingWebhookResponse {}

message RetryWebhookDeliveryRequest {
  string org_id = 1;
  string project_id = 2;
  string id = 3;
  string delivery_id = 4;
}

message RetryWebhookDeliveryResponse {}

message RetryFailedWebhookDeliveriesRequest {
  string org_id = 1;
  string project_id = 2;
  string id = 3;
}

message RetryFailedWebhookDeliveriesResponse {
  int32 requeued = 1;
}
